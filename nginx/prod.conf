upstream meetbowl_be {
    server be:8080;
}

upstream meetbowl_livekit {
    server livekit:7880;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 100m;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 알림 SSE는 응답을 즉시 전달해야 하므로 일반 API 프록시와 분리한다.
    # BE는 30초 heartbeat와 30분 emitter timeout을 사용하므로 프록시 timeout은 그보다 길게 둔다.
    location = /api/v1/notifications/subscribe {
        proxy_pass http://meetbowl_be;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 35m;
        proxy_send_timeout 35m;

        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;

        # EventSource 인증 토큰이 query string에 있으므로 access log에 요청 URI를 남기지 않는다.
        access_log off;
    }

    location /api/ {
        proxy_pass http://meetbowl_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /livekit/ {
        proxy_pass http://meetbowl_livekit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
