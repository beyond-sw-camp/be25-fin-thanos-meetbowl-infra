upstream meetbowl_be {
    server be:8080;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 알림 SSE는 응답을 즉시 전달해야 하므로 일반 API 프록시와 분리한다.
    # API ASG는 ALB 뒤에서 HTTP만 수신하므로 TLS 종료는 ALB에서 처리한다.
    location = /api/v1/notifications/subscribe {
        proxy_pass http://meetbowl_be;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 35m;
        proxy_send_timeout 35m;

        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://meetbowl_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
