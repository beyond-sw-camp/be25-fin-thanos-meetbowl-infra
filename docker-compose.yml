name: meetbowl-infra

services:
  mariadb:
    image: mariadb:11.4
    container_name: meetbowl-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-root-password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-meetbowl}
      MARIADB_USER: ${MARIADB_USER:-meetbowl}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-local-meetbowl-password}
      TZ: UTC
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - meetbowl-runtime

  redis:
    image: redis:7.4-alpine
    container_name: meetbowl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - meetbowl-runtime

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: meetbowl-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-meetbowl}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-rabbitmq-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - meetbowl-runtime

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: meetbowl-livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-local-livekit-secret-change-me-123456}"
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      - meetbowl-runtime

  stt:
    profiles: ["stt"]
    build:
      context: ../meetbowl-stt
    container_name: meetbowl-stt
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      INTERNAL_TOKEN: ${STT_INTERNAL_TOKEN:-meetbowl-local-internal-token-32bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_TRANSLATION_MODEL: ${OPENAI_REALTIME_TRANSLATION_MODEL:-gpt-realtime-translate}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-realtime-whisper}
      OPENAI_REALTIME_TRANSCRIPTION_DELAY: ${OPENAI_REALTIME_TRANSCRIPTION_DELAY:-low}
      ENABLE_TRANSLATION: ${ENABLE_TRANSLATION:-false}
      LIVEKIT_URL: ${STT_LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-local-livekit-secret-change-me-123456}
      LIVEKIT_AGENT_IDENTITY_PREFIX: ${LIVEKIT_AGENT_IDENTITY_PREFIX:-meetbowl-stt}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-meetbowl}:${RABBITMQ_DEFAULT_PASS:-local-rabbitmq-password}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-meetbowl.topic}
      REDIS_URL: redis://redis:6379
      REDIS_FEEDBACK_CONSUMER_GROUP: ${REDIS_FEEDBACK_CONSUMER_GROUP:-stt-feedback-relay}
      REDIS_FEEDBACK_CONSUMER_NAME: ${REDIS_FEEDBACK_CONSUMER_NAME:-stt-local}
      REDIS_STREAM_MAX_LENGTH: ${REDIS_STREAM_MAX_LENGTH:-2000}
      VAD_RMS_THRESHOLD: ${VAD_RMS_THRESHOLD:-0.008}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-180}
      SEGMENT_NO_DELTA_TIMEOUT_MS: ${SEGMENT_NO_DELTA_TIMEOUT_MS:-700}
      TRANSLATION_GRACE_MS: ${TRANSLATION_GRACE_MS:-180}
      MAX_SEGMENT_DURATION_MS: ${MAX_SEGMENT_DURATION_MS:-15000}
      TRACK_SWITCH_GRACE_MS: ${TRACK_SWITCH_GRACE_MS:-120}
    ports:
      - "${STT_PORT:-3000}:3000"
    depends_on:
      livekit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meetbowl-runtime

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: meetbowl-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - meetbowl-runtime

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: meetbowl-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - meetbowl-runtime

  nginx:
    image: nginx:1.27-alpine
    container_name: meetbowl-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - livekit
    networks:
      - meetbowl-runtime

networks:
  meetbowl-runtime:
    name: meetbowl-runtime

volumes:
  mariadb-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
  elasticsearch-data:
