services:
  be-worker:
    image: ${MEETBOWL_BE_IMAGE:?}
    container_name: meetbowl-be-worker
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MEETBOWL_APP_ROLE: ${MEETBOWL_APP_ROLE:-worker}
      JAVA_OPTS: ${MEETBOWL_BE_WORKER_JAVA_OPTS:-${MEETBOWL_BE_JAVA_OPTS:--Xms512m -Xmx1024m}}
      MEETBOWL_DB_URL: ${MEETBOWL_DB_URL:?}
      MEETBOWL_DB_USERNAME: ${MEETBOWL_DB_USERNAME:?}
      MEETBOWL_DB_PASSWORD: ${MEETBOWL_DB_PASSWORD:?}
      MEETBOWL_REDIS_HOST: ${MEETBOWL_REDIS_HOST:-redis}
      MEETBOWL_REDIS_PORT: ${MEETBOWL_REDIS_PORT:-6379}
      MEETBOWL_RABBITMQ_URI: ${MEETBOWL_RABBITMQ_URI:-}
      MEETBOWL_RABBITMQ_HOST: ${MEETBOWL_RABBITMQ_HOST:-rabbitmq}
      MEETBOWL_RABBITMQ_PORT: ${MEETBOWL_RABBITMQ_PORT:-5672}
      MEETBOWL_RABBITMQ_USERNAME: ${MEETBOWL_RABBITMQ_USERNAME:-${RABBITMQ_DEFAULT_USER}}
      MEETBOWL_RABBITMQ_PASSWORD: ${MEETBOWL_RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}
      MEETBOWL_RABBITMQ_VHOST: ${MEETBOWL_RABBITMQ_VHOST:-${RABBITMQ_DEFAULT_VHOST:-/}}
      MEETBOWL_RABBITMQ_EXCHANGE: ${MEETBOWL_RABBITMQ_EXCHANGE:-meetbowl.topic}
      MEETBOWL_RABBITMQ_MINUTES_GENERATED_QUEUE: ${MEETBOWL_RABBITMQ_MINUTES_GENERATED_QUEUE:-api.minutes.generated}
      MEETBOWL_JWT_SECRET: ${MEETBOWL_JWT_SECRET:?}
      MEETBOWL_INTERNAL_TOKEN: ${MEETBOWL_INTERNAL_TOKEN:?}
      MEETBOWL_LIVEKIT_URL: ${MEETBOWL_LIVEKIT_URL:?}
      MEETBOWL_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      MEETBOWL_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      MEETBOWL_LIVEKIT_TOKEN_EXPIRATION_SECONDS: ${MEETBOWL_LIVEKIT_TOKEN_EXPIRATION_SECONDS:-3600}
      MEETBOWL_STT_BASE_URL: ${MEETBOWL_STT_BASE_URL:?}
      MEETBOWL_STT_INTERNAL_TOKEN: ${MEETBOWL_STT_INTERNAL_TOKEN:-${MEETBOWL_INTERNAL_TOKEN}}
      MEETBOWL_AI_BASE_URL: ${MEETBOWL_AI_BASE_URL:?}
      MEETBOWL_ELASTICSEARCH_URL: ${MEETBOWL_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      MEETBOWL_USER_SEARCH_INDEX: ${MEETBOWL_USER_SEARCH_INDEX:-meetbowl-users}
      MEETBOWL_ELASTICSEARCH_AUTO_CREATE_INDEX: ${MEETBOWL_ELASTICSEARCH_AUTO_CREATE_INDEX:-false}
      MEETBOWL_ELASTICSEARCH_REINDEX_BATCH_SIZE: ${MEETBOWL_ELASTICSEARCH_REINDEX_BATCH_SIZE:-200}
      AWS_REGION: ${AWS_REGION:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${MEETBOWL_BE_WORKER_BIND_ADDRESS:-127.0.0.1}:${MEETBOWL_BE_WORKER_PORT:-18080}:8080"
    networks:
      - meetbowl-runtime

networks:
  meetbowl-runtime:
