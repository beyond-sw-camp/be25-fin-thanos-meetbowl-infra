name: meetbowl-search

services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: meetbowl-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - meetbowl-runtime

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: meetbowl-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - meetbowl-runtime

networks:
  meetbowl-runtime:
    name: meetbowl-prod-runtime

volumes:
  qdrant-data:
  elasticsearch-data:
