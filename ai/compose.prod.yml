services:
  ai:
    image: ${MEETBOWL_AI_IMAGE:?}
    container_name: meetbowl-ai
    restart: unless-stopped
    environment:
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: ${RABBITMQ_URL:?}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-meetbowl.topic}
      RABBITMQ_MINUTES_GENERATE_QUEUE: ${RABBITMQ_MINUTES_GENERATE_QUEUE:-ai.minutes.generate}
      RABBITMQ_MINUTES_REGENERATE_QUEUE: ${RABBITMQ_MINUTES_REGENERATE_QUEUE:-ai.minutes.regenerate}
      RABBITMQ_DOCUMENT_INDEX_QUEUE: ${RABBITMQ_DOCUMENT_INDEX_QUEUE:-ai.index.document}
      RABBITMQ_DOCUMENT_INDEX_REMOVED_QUEUE: ${RABBITMQ_DOCUMENT_INDEX_REMOVED_QUEUE:-ai.index.document.removed}
      RABBITMQ_MINUTES_GENERATED_ROUTING_KEY: ${RABBITMQ_MINUTES_GENERATED_ROUTING_KEY:-minutes.generated}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      REDIS_FEEDBACK_ENABLED: ${REDIS_FEEDBACK_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:?}
      REDIS_FEEDBACK_CONSUMER_GROUP: ${REDIS_FEEDBACK_CONSUMER_GROUP:-ai-feedback}
      REDIS_FEEDBACK_CONSUMER_NAME: ${REDIS_FEEDBACK_CONSUMER_NAME:-ai-prod}
      REDIS_FEEDBACK_STREAM_MAX_LENGTH: ${REDIS_FEEDBACK_STREAM_MAX_LENGTH:-2000}
      REDIS_FEEDBACK_SCAN_INTERVAL_SECONDS: ${REDIS_FEEDBACK_SCAN_INTERVAL_SECONDS:-1.0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MINUTES_MODEL_PROFILE: ${MINUTES_MODEL_PROFILE:-minutes-summary}
      MINUTES_SUMMARY_PROVIDER: ${MINUTES_SUMMARY_PROVIDER:-gemini}
      MINUTES_SUMMARY_MODEL: ${MINUTES_SUMMARY_MODEL:-gemini-2.5-flash}
      MINUTES_SUMMARY_TEMPERATURE: ${MINUTES_SUMMARY_TEMPERATURE:-0.2}
      MINUTES_PROMPT_VERSION: ${MINUTES_PROMPT_VERSION:-minutes-v1}
      CHATBOT_MODEL_PROFILE: ${CHATBOT_MODEL_PROFILE:-chatbot}
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-gemini}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-gemini-2.5-flash}
      CHATBOT_TEMPERATURE: ${CHATBOT_TEMPERATURE:-0.2}
      CHAT_PROMPT_VERSION: ${CHAT_PROMPT_VERSION:-chat-v2}
      FAKE_CHAT_MODEL_NAME: ${FAKE_CHAT_MODEL_NAME:-fake-chat-model}
      FAKE_CHAT_RAG_ENABLED: ${FAKE_CHAT_RAG_ENABLED:-false}
      DOCUMENT_EMBEDDING_MODEL_PROFILE: ${DOCUMENT_EMBEDDING_MODEL_PROFILE:-document-embedding}
      DOCUMENT_EMBEDDING_PROVIDER: ${DOCUMENT_EMBEDDING_PROVIDER:-openai}
      DOCUMENT_EMBEDDING_MODEL: ${DOCUMENT_EMBEDDING_MODEL:-text-embedding-3-large}
      DOCUMENT_EMBEDDING_DIMENSIONS: ${DOCUMENT_EMBEDDING_DIMENSIONS:-1536}
      QUERY_EMBEDDING_MODEL_PROFILE: ${QUERY_EMBEDDING_MODEL_PROFILE:-query-embedding}
      QUERY_EMBEDDING_PROVIDER: ${QUERY_EMBEDDING_PROVIDER:-openai}
      QUERY_EMBEDDING_MODEL: ${QUERY_EMBEDDING_MODEL:-text-embedding-3-large}
      QUERY_EMBEDDING_DIMENSIONS: ${QUERY_EMBEDDING_DIMENSIONS:-1536}
      QDRANT_URL: ${QDRANT_URL:?}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-meetbowl-documents-openai-large-1536}
      DOCUMENT_CHUNK_SIZE: ${DOCUMENT_CHUNK_SIZE:-1200}
      DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-150}
      DOCUMENT_CHUNK_STRATEGY_VERSION: ${DOCUMENT_CHUNK_STRATEGY_VERSION:-paragraph-v1}
      DOCUMENT_EXTRACTION_MODEL: ${DOCUMENT_EXTRACTION_MODEL:-gemini-2.5-flash}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:?}
      AWS_REGION: ${AWS_REGION:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      BE_BASE_URL: ${BE_BASE_URL:?}
      BE_CONTEXT_TIMEOUT_SECONDS: ${BE_CONTEXT_TIMEOUT_SECONDS:-5.0}
      FEEDBACK_DEMO_MODE: ${FEEDBACK_DEMO_MODE:-false}
      FEEDBACK_WINDOW_MAX_SEGMENTS: ${FEEDBACK_WINDOW_MAX_SEGMENTS:-8}
      FEEDBACK_WINDOW_MAX_SECONDS: ${FEEDBACK_WINDOW_MAX_SECONDS:-45}
      FEEDBACK_MIN_SEGMENTS: ${FEEDBACK_MIN_SEGMENTS:-4}
      FEEDBACK_MIN_WINDOW_CHARS: ${FEEDBACK_MIN_WINDOW_CHARS:-40}
      FEEDBACK_TRIGGER_INTERVAL_SECONDS: ${FEEDBACK_TRIGGER_INTERVAL_SECONDS:-15}
      FEEDBACK_COOLDOWN_SECONDS: ${FEEDBACK_COOLDOWN_SECONDS:-90}
      FEEDBACK_STATE_TTL_SECONDS: ${FEEDBACK_STATE_TTL_SECONDS:-300}
      FEEDBACK_SCORE_THRESHOLD: ${FEEDBACK_SCORE_THRESHOLD:-0.78}
      FEEDBACK_CANDIDATE_LIMIT: ${FEEDBACK_CANDIDATE_LIMIT:-3}
      CHAT_SCORE_THRESHOLD: ${CHAT_SCORE_THRESHOLD:-0.0}
      CHAT_DOCUMENT_MAX_CHARS: ${CHAT_DOCUMENT_MAX_CHARS:-16000}
      CHAT_THINKING_BUDGET: ${CHAT_THINKING_BUDGET:-512}
      RERANK_CANDIDATE_POOL: ${RERANK_CANDIDATE_POOL:-30}
      RERANK_TOP_N: ${RERANK_TOP_N:-10}
    ports:
      - "${MEETBOWL_AI_BIND_ADDRESS:-127.0.0.1}:${MEETBOWL_AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/api/v1/health/ready"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - meetbowl-runtime

networks:
  meetbowl-runtime:
    name: meetbowl-prod-runtime
