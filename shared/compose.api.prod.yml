name: meetbowl-prod-api

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: meetbowl-nginx-api
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      be:
        condition: service_started
    networks:
      - meetbowl-runtime

networks:
  meetbowl-runtime:
    name: meetbowl-prod-runtime
